services:
  - type: web
    name: stoba95-elections
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev is required here: NODE_ENV=production (below) makes npm
    # skip devDependencies otherwise, but vite/typescript/@types/* — needed
    # to build — all live there.
    buildCommand: npm --prefix client install --include=dev && npm --prefix client run build && npm --prefix server install --include=dev && npm --prefix server run build
    # preDeployCommand isn't supported on the free plan, so the (idempotent)
    # schema migration runs as part of every start instead.
    startCommand: npm --prefix server run migrate && npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stoba95-db
          property: connectionString

databases:
  # Free tier: expires 30 days after creation (14-day grace period to
  # upgrade before data is deleted). Fine for now, but if this platform
  # needs to persist past that, upgrade to a paid plan before it lapses.
  - name: stoba95-db
    plan: free
    region: frankfurt
    databaseName: stoba95
    user: stoba95
